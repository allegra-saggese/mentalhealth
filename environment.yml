# conda environment for the mentalhealth pipeline.  Create:  conda env create -f environment.yml
# Packages are installed with pip from requirements.txt so the pinned versions are exactly those used for the results.
name: mentalhealth
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - -r requirements.txt
variables:
  PYTHONHASHSEED: "0"      # pyfixest results depend on the hash seed at about 2e-5 in SEs; fixing it makes runs reproducible
